name: zxf
permissions:
  contents: write
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate APT Packages index
        run: |
          sudo apt update
          sudo apt install dpkg-dev -y
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9c Packages > Packages.gz

      - name: Commit & Push index
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update apt index"; git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)
